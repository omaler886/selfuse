name: Build all rulesets

on:
  schedule:
    - cron: "30 2 * * *" # 每日 02:30 UTC（接在 update-srs 02:00 之后）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cores (latest stable)
        run: |
          set -e
          MIHOMO_TAG=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_TAG}/mihomo-linux-amd64-${MIHOMO_TAG}.gz" | gunzip > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          SB_TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/${SB_TAG}/sing-box-${SB_TAG#v}-linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin sing-box-${SB_TAG#v}-linux-amd64/sing-box
          mihomo -v | head -1
          sing-box version | head -1

      - name: Build
        run: python3 scripts/build_all_rules.py

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.mrs' '*.srs' '*.list' build-report.md rules/counts.json
          git diff --staged --quiet || { git commit -m "build: daily rulesets $(date -u +%F)"; git push; }
