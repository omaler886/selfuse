name: Refresh proxy-lite (DNS liveness)

on:
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cores
        run: |
          set -e
          MIHOMO_TAG=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_TAG}/mihomo-linux-amd64-${MIHOMO_TAG}.gz" | gunzip > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          SB_TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/${SB_TAG}/sing-box-${SB_TAG#v}-linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin sing-box-${SB_TAG#v}-linux-amd64/sing-box
          mihomo -v | head -1

      - name: Sync parking-NS list (MISP warninglists)
        continue-on-error: true
        run: python3 scripts/sync_parking_ns.py

      - name: Scan upstream liveness (UDP 53, overseas runner)
        run: python3 scripts/scan_proxy_lite.py

      - name: Build proxy-lite (mrs + srs)
        run: |
          MIHOMO_BIN=/usr/local/bin/mihomo SINGBOX_BIN=/usr/local/bin/sing-box \
            python3 scripts/build_all_rules.py --only proxy-lite

      - name: Upload parked-ns list (parking nameserver hits, removed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parked-ns
          path: parked-ns.txt
          if-no-files-found: ignore

      - name: Upload ns-suspect list (NS hit but page OK, kept — observability only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-suspect
          path: ns-suspect.txt
          if-no-files-found: ignore

      - name: Upload tcp-timeout list (auth-wall candidates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-timeout
          path: tcp-timeout.txt
          if-no-files-found: ignore

      - name: Upload sale-pages list (for-sale / cdn-dead removed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sale-pages
          path: sale-pages.txt
          if-no-files-found: ignore

      - name: Upload http-only list (443 failed / 80 ok, kept)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-only
          path: http-only.txt
          if-no-files-found: ignore

      - name: Upload noresp list (443+80 both failed, kept)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noresp
          path: noresp.txt
          if-no-files-found: ignore

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- custom/proxy-lite.domain.txt proxy-lite.mrs proxy-lite.srs rules/counts.json data/parking-ns.txt
          git diff --staged --quiet && echo "no changes" || {
            git commit -m "refresh: proxy-lite liveness scan $(date -u +%F)"
            git push
          }
