name: Update upstream SRS snapshots

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync SRS files
        run: bash .github/scripts/update-upstream-srs.sh
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sing-box/rule-set/upstream sing-box/rule-set/flow.srs sing-box/rule-set/sakura_domian.srs
          git diff --staged --quiet || { git commit -m "chore: sync upstream srs snapshots"; git push; }
